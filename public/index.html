<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart IoT Monitoring - Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Inter", sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #071b34, #0b3157, #0d6efd);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .background {
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.18;
        }

        .circle.one {
            width: 350px;
            height: 350px;
            background: #20c997;
            top: -120px;
            left: -100px;
        }

        .circle.two {
            width: 450px;
            height: 450px;
            background: #0dcaf0;
            bottom: -180px;
            right: -150px;
        }

        .login-container {
            position: relative;
            z-index: 2;
            width: 430px;
            max-width: 92%;
            background: rgba(255,255,255,0.97);
            border-radius: 24px;
            padding: 42px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.28);
        }

        .logo {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg,#168cff,#0062d9);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
        }

        h1 {
            text-align: center;
            color: #0b1f38;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        .input-box {
            position: relative;
        }

        .input-box > i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #718096;
        }

        input {
            width: 100%;
            height: 52px;
            border: 1px solid #dce3eb;
            border-radius: 12px;
            padding: 0 45px;
            font-size: 14px;
            outline: none;
            color: #1e293b;
        }

        input:focus {
            border-color: #168cff;
            box-shadow: 0 0 0 4px rgba(22,140,255,0.1);
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #718096;
            cursor: pointer;
        }

        .login-button {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg,#168cff,#0062d9);
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            text-align: center;
        }

        .message.error {
            display: block;
            background: #fff0f0;
            color: #dc3545;
        }

        .footer {
            text-align: center;
            margin-top: 28px;
            color: #94a3b8;
            font-size: 12px;
        }

    </style>
</head>

<body>

<div class="background">
    <div class="circle one"></div>
    <div class="circle two"></div>
</div>


<div class="login-container">

    <div class="logo">
        <i class="fa-solid fa-house-signal"></i>
    </div>

    <h1>Smart IoT Monitoring</h1>

    <p class="subtitle">
        Environmental Monitoring & Smart Appliance Control
    </p>


    <form id="loginForm">

        <div class="input-group">

            <label>Email Address</label>

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

        </div>


        <div class="input-group">

            <label>Password</label>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <span class="password-toggle" id="togglePassword">
                    <i class="fa-solid fa-eye"></i>
                </span>

            </div>

        </div>


        <button
            type="submit"
            class="login-button"
            id="loginButton">

            <i class="fa-solid fa-right-to-bracket"></i>
            &nbsp; Login

        </button>


        <div
            class="message"
            id="message">
        </div>

    </form>


    <div class="footer">
        Smart IoT Monitoring System • Firebase Powered
    </div>

</div>


<script>


/* ================================
   FIREBASE CONFIG
================================ */

const firebaseConfig = {

    apiKey:
    "AIzaSyCTUvo4L2E9QhDFQ21SSMKjA3BDTaOG8M4",

    authDomain:
    "smart-iot-monitoring-36700.firebaseapp.com",

    databaseURL:
    "https://smart-iot-monitoring-36700-default-rtdb.firebaseio.com/",

    projectId:
    "smart-iot-monitoring-36700",

    storageBucket:
    "smart-iot-monitoring-36700.firebasestorage.app",

    messagingSenderId:
    "306714863231",

    appId:
    "1:306714863231:web:717219a9fe968c3baa014a",

    measurementId:
    "G-TJNYB99LSH"
};


/* Initialize Firebase */

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();


/* ================================
   LOGIN
================================ */

document
.getElementById("loginForm")
.addEventListener("submit", function(event) {

    event.preventDefault();


    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const button =
        document.getElementById("loginButton");

    const message =
        document.getElementById("message");


    message.style.display = "none";

    button.disabled = true;

    button.innerHTML =
        '<i class="fa-solid fa-spinner fa-spin"></i> Logging in...';


    /*
       IMPORTANT:
       Save Firebase login locally
       before opening dashboard.
    */

    auth.setPersistence(
        firebase.auth.Auth.Persistence.LOCAL
    )

    .then(function() {

        return auth.signInWithEmailAndPassword(
            email,
            password
        );

    })

    .then(function(result) {

        console.log(
            "Login successful:",
            result.user.email
        );


        /*
           Small delay gives Firebase time
           to save authentication state.
        */

        setTimeout(function() {

            window.location.replace("dashboard.html");

        }, 300);

    })

    .catch(function(error) {

        console.error(error);


        let errorMessage =
            "Login failed. Please check your email and password.";


        if (error.code === "auth/invalid-credential") {

            errorMessage =
                "Incorrect email or password.";

        }

        else if (error.code === "auth/user-not-found") {

            errorMessage =
                "No account found with this email.";

        }

        else if (error.code === "auth/wrong-password") {

            errorMessage =
                "Incorrect password.";

        }

        else if (error.code === "auth/invalid-email") {

            errorMessage =
                "Please enter a valid email address.";

        }


        message.textContent = errorMessage;

        message.className = "message error";


        button.disabled = false;

        button.innerHTML =
            '<i class="fa-solid fa-right-to-bracket"></i> &nbsp; Login';

    });

});


/* ================================
   SHOW / HIDE PASSWORD
================================ */

document
.getElementById("togglePassword")
.addEventListener("click", function() {

    const password =
        document.getElementById("password");

    const icon =
        this.querySelector("i");


    if (password.type === "password") {

        password.type = "text";

        icon.classList.remove("fa-eye");

        icon.classList.add("fa-eye-slash");

    }

    else {

        password.type = "password";

        icon.classList.remove("fa-eye-slash");

        icon.classList.add("fa-eye");

    }

});

</script>

</body>
</html>
